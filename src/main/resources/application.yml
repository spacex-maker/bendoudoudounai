spring:
  application:
    name: bendoudou-server
  config:
    # 本地密钥（gitignored）。必须从仓库根目录启动，才能解析到 ./secrets/
    # 也可用 scripts/ensure_local_secrets.py 从旧仓同步并去掉 UTF-8 BOM
    import: optional:file:./secrets/bendoudou.env[.properties]
  datasource:
    # 库名: bendoudoudounai，首次可在服务端执行: CREATE DATABASE bendoudoudounai CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    url: jdbc:mysql://175.27.255.29:33306/bendoudoudounai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "Aimate2026!MySQL"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 120MB
      max-request-size: 125MB
  # QQ SMTP：账号/授权码放 secrets/bendoudou.env 或环境变量，勿写进仓库
  mail:
    host: smtp.qq.com
    port: 465
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465

server:
  port: 8882
  error:
    # 便于接口返回具体原因（如 COS 未配置、multipart 校验）；生产若需隐藏可改为 never
    include-message: always

security:
  jwt:
    secret: ${BENDOUDOU_JWT_SECRET:BendoudouOurLittleSiteJwtSecretKey2026MustBe32B+}
    # 90d：需长于前端「30 天无操作才登出」的滑动策略，避免活跃用户仍因 JWT 到期被踢
    access-token-validity-seconds: 7776000

bendoudou:
  # 本地上传目录，相对 JAR 运行目录
  music-upload-dir: ${BENDOUDOU_MUSIC_UPLOAD:uploads/music}
  # 腾讯云 COS（密钥请用环境变量，勿把真实 AK/SK 写进仓库）
  cos:
    enabled: true
    secret-id: ${TENCENTCLOUD_SECRET_ID:}
    secret-key: ${TENCENTCLOUD_SECRET_KEY:}
    bucket: px-1258150206
    region: ap-nanjing
    path-prefix: bendoudou/music/
  # 网易云（发现音乐）；Cookie 会过期，用环境变量注入
  netease:
    music-u: ${BENDOUDOU_NETEASE_MUSIC_U:}
    csrf: ${BENDOUDOU_NETEASE_CSRF:}
    user-agent: ${BENDOUDOU_NETEASE_UA:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36}
  mail:
    # 发件显示名；SMTP 账号与 productx spring.mail.user 相同
    personal: AIMATEX-MUSIC
